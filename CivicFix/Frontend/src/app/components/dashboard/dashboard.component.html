<div class="container my-4">
  <h3 class="fw-bold text-primary mb-3">Dashboard Municipal</h3>
  <p class="text-muted small">Resumen general de las incidencias reportadas en la ciudad.</p>

  <div class="row">
    <div class="col-md-3 mb-3">
      <div class="card shadow-sm border-0 p-3 text-center">
        <h6 class="text-muted">Total Reportes</h6>
        <h2 class="fw-bold text-primary">{{ totalReportes }}</h2>
      </div>
    </div>
    <div class="col-md-3 mb-3">
      <div class="card shadow-sm border-0 p-3 text-center">
        <h6 class="text-muted">Pendientes</h6>
        <h2 class="fw-bold text-danger">{{ pendientes }}</h2>
      </div>
    </div>
    <div class="col-md-3 mb-3">
      <div class="card shadow-sm border-0 p-3 text-center">
        <h6 class="text-muted">En Proceso</h6>
        <h2 class="fw-bold" style="color: #EF6C00;">{{ enProceso }}</h2>
      </div>
    </div>
    <div class="col-md-3 mb-3">
      <div class="card shadow-sm border-0 p-3 text-center">
        <h6 class="text-muted">Resueltos</h6>
        <h2 class="fw-bold text-success">{{ resueltos }}</h2>
      </div>
    </div>
  </div>
</div>
