<aside class="civic-sidebar">

  <div class="civic-brand">
    <div class="civic-logo-wrapper">
      <img
        src="/assets/CIVICFIX_LOGO-removebg-preview.png"
        alt="CIVICFIX"
        class="civic-logo"
      >
    </div>
  </div>

  <nav class="civic-navigation">

    <a routerLink="/home-admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </a>

    <a routerLink="/admin/usuarios" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-people-fill"></i>
      <span>Usuarios</span>
    </a>

    <a routerLink="/admin/empleados" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-person-badge-fill"></i>
      <span>Empleados</span>
    </a>

    <a routerLink="/admin/municipalidades" routerLinkActive="active" class="civic-nav-item">
      <i class="bi bi-buildings-fill"></i><span>Municipalidades</span>
    </a>

    <a routerLink="/admin/departamentos" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-building"></i>
      <span>Departamentos</span>
    </a>

    <a routerLink="/admin/servicios" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-briefcase-fill"></i>
      <span>Servicios</span>
    </a>

    <a routerLink="/admin/tipos-incidencia" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>Incidencias</span>
    </a>

    <a routerLink="/admin/prioridades" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-bar-chart-fill"></i>
      <span>Prioridades</span>
    </a>

    <a routerLink="/admin/estados" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-list-check"></i>
      <span>Estados</span>
    </a>

    <a routerLink="/admin/reportes" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-file-earmark-text-fill"></i>
      <span>Reportes</span>
    </a>

    <a routerLink="/admin/ubicaciones" routerLinkActive="active" class="civic-nav-item">
      <i class="bi bi-geo-alt-fill"></i><span>Ubicaciones</span>
    </a>

    <a routerLink="/admin/asignaciones" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-person-check-fill"></i>
      <span>Asignaciones</span>
    </a>

    <a routerLink="/admin/bitacora" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="civic-nav-item">
      <i class="bi bi-clock-history"></i>
      <span>Bitácora</span>
    </a>

  </nav>

  <div class="civic-city">

    <div class="city-buildings">
      <span class="building b1"></span>
      <span class="building b2"></span>
      <span class="building b3"></span>
      <span class="building b4"></span>
      <span class="building b5"></span>

      <span class="tree t1"></span>
      <span class="tree t2"></span>

      <span class="lamp"></span>
    </div>

    <div class="civic-city-footer">

      <div class="municipality-icon">
        <i class="bi bi-shield-fill-check"></i>
      </div>

      <div>
        <strong>Municipalidad de Guatemala</strong>
        <small>Juntos mejoramos la ciudad</small>
      </div>

    </div>

  </div>

</aside>
